# Configuration du moteur (Phase 1).

engine:
  # Nombre d'événements traités avant l'arrêt (null = infini).
  max_events: 60000
  # Affichage console toutes les N trades.
  report_every: 20000

feed:
  # "simulated" (flux déterministe, sans clé), "alpaca" (temps réel) ou
  # "replay" (rejoue le journal replay_path avec exactement le même moteur).
  # Alpaca lit ses clés dans APCA_API_KEY_ID / APCA_API_SECRET_KEY.
  provider: simulated
  replay_path: data/events.jsonl
  symbols: [SPY, QQQ, TLT, GLD]
  seed: 42
  # Intervalle entre deux trades simulés (secondes de temps de marché).
  tick_seconds: 5.0
  alpaca:
    # "iex" (plan gratuit) ou "sip" (plan payant). url permet de forcer un
    # autre endpoint, ex. wss://stream.data.alpaca.markets/v2/test.
    data_feed: iex
    trades: true
    quotes: false   # très volumineux en SIP
    bars: true      # barres 1 minute Alpaca
    heartbeat_interval: 20   # ping après N s sans message
    heartbeat_timeout: 10    # reconnexion si pas de pong
    backoff_initial: 1
    backoff_max: 60

bars:
  timeframes: [5m, 1h, 1d]

features:
  # Horizons de momentum ; chacun est calculé sur la plus longue barre qui le
  # divise (30m = 6 barres 5m, 20d = 20 barres 1d).
  momentum_horizons: [5m, 30m, 1h, 1d, 20d, 60d, 252d]
  mean_reversion_timeframes: [5m]
  zscore_window: 20
  # null = tous les timeframes de barres
  correlation_timeframes: [5m, 1h, 1d]

allocation:
  # Interrupteur d'ablation :
  #   static      : portfolio.target_weights
  #   baseline    : momentum + volatility targeting (la référence à battre)
  #   risk_parity : contributions au risque égales
  #   hrp         : hierarchical risk parity
  #   signal      : budgets de risque issus des signaux (pondérés par le skill
  #                 du modèle) + risk parity
  method: static
  # Recalcul de la cible (et du rapport de risque) à chaque barre de ce timeframe.
  rebalance_timeframe: 1h
  target_vol: 0.10       # volatilité annualisée visée
  min_skill: 0.0         # skill minimum d'un modèle pour influencer la cible
  constraints:
    max_weight: 0.40
    min_weight: 0.0      # 0 = long-only
    max_gross: 1.0
    min_cash: 0.02
    max_portfolio_vol: 0.15
    max_turnover: 0.50   # par rebalancement (somme des |variations de poids|)
    sectors: {SPY: equity, QQQ: equity, TLT: bonds, GLD: commodities}
    sector_limits: {equity: 0.60}
  baseline:
    momentum_horizon: 1h
    vol_timeframe: 1h
    target_vol: 0.10     # volatilité annualisée cible du portefeuille
    budget: 1.0          # fraction maximale investie
    max_weight: 0.40

models:
  # HMM de régime par symbole et par horizon (estimation probabiliste).
  regimes:
    enabled: true
    n_states: 3            # LOW_VOL / MID_VOL / HIGH_VOL
    timeframes: {HF: 5m, MT: 1h, LT: 1d}
    min_samples: 100       # warm-up avant le premier ajustement
    window: 500            # fenêtre glissante (oubli)
    refit_every: 50        # ré-ajustement Baum-Welch toutes les N barres
  # Modèle de facteurs online : E[r_{t+h} | features], avec incertitude.
  factor:
    enabled: true
    timeframe: 5m
    horizon_bars: 6        # prévision à 30 minutes
    features: [mom_30m, mom_1h, z_5m, reversal_5m, vwap_dist]
    forgetting: 0.995      # poids lambda^age des observations passées
    ridge: 10.0            # régularisation
    min_samples: 50        # pas de signal avant N résultats observés

risk:
  timeframe: 1h          # barres utilisées pour la covariance
  shrinkage: 0.1         # shrinkage de la covariance vers sa diagonale
  limits:
    max_weight: 0.40
    max_gross_leverage: 1.0
    max_portfolio_vol: 0.20
    max_drawdown: 0.15
    max_risk_contribution: 0.50
    max_position_drawdown: 0.25
    max_drift: 0.05

storage:
  # Journal JSONL des événements bruts reçus (null = désactivé). Sert au replay.
  event_log: null

volatility:
  # Facteur de décroissance EWMA (RiskMetrics : 0.94 en daily).
  lambda: 0.94

portfolio:
  cash: 10000.0
  positions:
    SPY: {quantity: 10, avg_price: 620.0}
    QQQ: {quantity: 5, avg_price: 540.0}
    TLT: {quantity: 20, avg_price: 88.0}
  target_weights:
    SPY: 0.40
    QQQ: 0.20
    TLT: 0.20
    GLD: 0.10
