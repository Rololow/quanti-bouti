# Surcouche : levier (jusqu'à 2×) avec contrôle du drawdown.
#
# Le levier est représenté par des positions financées au taux court + 0,5 %
# (≈ financement implicite des futures sur indices / Treasuries ; un prêt sur
# marge chez un broker coûte nettement plus : ajuster financing.borrow_spread).
# Le contrôle du drawdown (Grossman-Zhou) réduit l'exposition à mesure que la
# perte depuis le plus haut **des 12 derniers mois** approche la limite (le
# plus haut historique enfermait le portefeuille en cash après une perte).
#
# Avec levier, arrêter le moteur sur une perte (HALTED) fige les positions
# levées au pire moment : la réponse aux pertes est la réduction d'exposition
# (contrôle du drawdown, désendettement forcé si l'exposition dérive au-delà du
# plafond), pas l'arrêt. Le Safety Engine garde l'arrêt pour les anomalies
# (données, modèles, perte journalière > 10 %, invariants larges).
#
# À utiliser avec config/universe_wide.yaml (classes d'actifs).

allocation:
  method: class_parity
  target_vol: 0.12
  drawdown_control: 0.15
  drawdown_window_days: 365
  drawdown_multiplier: 1.0       # 2 = CPPI : pleine exposition dans les petites baisses
  # Filtre de tendance (désactivé ici ; variantes *_tendance du backtest).
  trend:
    enabled: false
    timeframe: 1d
    horizons: [21, 63, 126, 252]
    floor: 0.0
    redistribute: false
    update_every: 1              # 5 = score hebdomadaire (moins de TOB)
    min_change: 0.0              # 0.5 = changer seulement si 2 horizons sur 4 basculent
  constraints:
    max_gross: 2.0
    max_weight: 0.80
    sector_limits: {equity: 1.0}

financing:
  enabled: true
  borrow_spread: 0.005

hard_controls:
  max_target_weight: 0.80
  max_target_gross: 2.0

risk:
  limits:
    max_gross_leverage: 2.05
    max_weight: 0.85
    max_drawdown: 0.15

safety:
  halt_on_breaches: []
  max_daily_loss: 0.10
  # Dérive des prix avec levier : l'exposition peut dépasser le plafond entre
  # deux décisions ; le désendettement forcé la ramène (decision.delever_tolerance).
  invariant_gross_tolerance: 0.25
  invariant_cash_tolerance: 0.25

decision:
  delever_tolerance: 0.05
