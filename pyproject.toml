[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quanti-bouti"
version = "0.1.0"
description = "Real-time adaptive quantitative portfolio engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.26",
    "websockets>=13",
    "tzdata>=2024.1",   # fuseau America/New_York (indispensable sous Windows)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ai = ["anthropic>=1.0"]      # extraction des news par Claude (ai.provider: claude)

[tool.setuptools.packages.find]
include = ["trading_engine*"]

[tool.setuptools.package-data]
"trading_engine.dashboard" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
