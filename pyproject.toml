[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quanti-bouti"
version = "0.1.0"
description = "Real-time adaptive quantitative portfolio engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.26",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["trading_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
