name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Installation depuis le clone : un module non commité fait échouer la CI.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Simulation de bout en bout
        run: python -m trading_engine.main --quiet
