name: backtest

# Backtest sur données réelles quotidiennes (Yahoo, repli Stooq), lancé à la
# main (onglet Actions -> backtest -> Run workflow) et chaque lundi. Le rapport
# s'affiche dans le résumé du job et reste téléchargeable (artefact). Les
# données ne sont pas commitées (sources non officielles, pas de
# redistribution) ; elles sont gardées en cache une semaine.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Début des données (AAAA-MM-JJ)"
        default: "2006-03-01"
      symbols:
        description: "Symboles (vide = feed.symbols de la config)"
        default: ""
      grid:
        description: "Grille du walk-forward"
        default: "decision.holding_period=20d,60d,120d"
      variants:
        description: "Variantes du moteur"
        default: "sans_modeles,classes"
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - ".github/workflows/backtest.yml"
      - "trading_engine/backtest/**"
      - "config/backtest_daily.yaml"
      - "trading_engine/tax/fx.py"
      - "config/universe_wide.yaml"
      - "config/tax_ucits.yaml"

permissions:
  contents: read

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      START: ${{ inputs.start || '2006-03-01' }}
      SYMBOLS: ${{ inputs.symbols || '' }}
      GRID: ${{ inputs.grid || 'decision.holding_period=20d,60d,120d' }}
      VARIANTS: ${{ inputs.variants || 'sans_modeles,classes' }}
      # Univers : 8 ETF, 3 classes d'actifs (DBC coté depuis février 2006).
      UNIVERSE: config/universe_wide.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Cache des données (une semaine)
        id: cache
        uses: actions/cache@v4
        with:
          path: data/backtest
          key: daily-v3-${{ env.START }}-${{ env.SYMBOLS }}-${{ github.run_id }}
          restore-keys: daily-v3-${{ env.START }}-${{ env.SYMBOLS }}-
      - name: Données quotidiennes
        run: |
          set -o pipefail
          args=(--start "$START")
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          if [ -f data/backtest/daily.jsonl.fx.json ] && [ -n "$(find data/backtest/daily.jsonl -mtime -7)" ]; then
            echo "données en cache (moins d'une semaine)"
          else
            python -m trading_engine.backtest --overlay "$UNIVERSE" download-daily "${args[@]}" --source yahoo \
              || python -m trading_engine.backtest --overlay "$UNIVERSE" download-daily "${args[@]}" --source stooq
          fi
      - name: Datasets après impôts belges (dividendes nets)
        run: |
          dir=data/backtest/csv_yahoo
          files=()
          for f in "$dir"/*.csv; do files+=("$(basename "$f" .csv)=$f"); done
          python -m trading_engine.backtest --overlay "$UNIVERSE" import-csv "${files[@]}" --net-dividends --no-fx \
            --out data/backtest/daily_us.jsonl
          python -m trading_engine.backtest --overlay "$UNIVERSE" --overlay config/tax_ucits.yaml import-csv "${files[@]}" \
            --net-dividends --no-fx --out data/backtest/daily_ucits.jsonl
          for d in daily_us daily_ucits; do
            if [ -f data/backtest/daily.jsonl.fx.json ]; then
              cp data/backtest/daily.jsonl.fx.json "data/backtest/$d.jsonl.fx.json"
            fi
          done
      - name: Backtest — ETF US distribuants (précompte 30 %, TOB 0,35 %)
        run: |
          python -m trading_engine.backtest --overlay config/backtest_daily.yaml --overlay "$UNIVERSE" run \
            --data data/backtest/daily_us.jsonl --grid "$GRID" --variants "$VARIANTS" \
            --out data/backtest/report_us.json
      - name: Backtest — UCITS capitalisants (Reynders, TOB 0,12 %)
        run: |
          python -m trading_engine.backtest --overlay config/backtest_daily.yaml --overlay "$UNIVERSE" --overlay config/tax_ucits.yaml run \
            --data data/backtest/daily_ucits.jsonl --grid "$GRID" --variants "$VARIANTS" \
            --out data/backtest/report_ucits.json
      - name: Rapports dans le résumé
        if: always()
        run: |
          for r in us:"ETF US distribuants" ucits:"UCITS irlandais de capitalisation"; do
            f="data/backtest/report_${r%%:*}.md"
            if [ -f "$f" ]; then
              { echo "# Scénario fiscal : ${r#*:}"; echo; cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-report
          path: |
            data/backtest/report_*.md
            data/backtest/report_*.json
          if-no-files-found: ignore
